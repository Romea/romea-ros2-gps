name: gps
namespace: ns
launch:
  - include:
      file: $(find-pkg-share romea_gps_meta_bringup)/profile/gz_bridge.launch.py
      if: $(eval "'$(var mode)' == 'simulation_gazebo'")
configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
location:
  parent_link: world  # Fixed to the simulation world in standalone mode
  xyz: [1.0, 2.0, 3.0]
records:
  nmea_sentence: true
