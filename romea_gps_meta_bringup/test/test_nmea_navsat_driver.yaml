name: gps
launch:
  - node:
      pkg: romea_gps_meta_bringup
      profile: config/nmea_navsat_serial_reader.profile.yaml
      param:
        - name: port
          value: /dev/ttyACM0
        - name: baud
          value: 115200
  - node:
      pkg: romea_gps_meta_bringup
      profile: config/nmea_navsat_topic_driver.profile.yaml
configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
