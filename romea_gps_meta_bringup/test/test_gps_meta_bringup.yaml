name: gps
namespace: ns
launch:
  - include:
      file: "$(find-pkg-share romea_gps_meta_bringup)/profile/romea_gps_serial_driver.launch.py"
      arg:
        - name: device
          value: /dev/ttyUSB0
        - name: baudrate
          value: "115200"
  - include:
      file: "$(find-pkg-share romea_gps_meta_bringup)/profile/ntrip_client.launch.py"
      arg:
        - name: mountpoint
          value: MTLDR
configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
records:
  nmea_sentence: true
  gps_fix: false
  vel: false
