name: gps
namespace: ns

# launch file 
# available args
#  - mode
# available vars
#  - manufacturer
#  - model
#  - version
#  - rate
#  - gps_fix_uere
#  - dgps_fix_uere
#  - float_rtk_fix_uere
#  - rtk_fix_uere
#  - simulation_fix_uere
#  - antenna_model
#  - dual_antenna
#  - xyz
#  - tf_prefix
#  - frame_id
launch:
  - group:
      children:
          - include:
              file: "$(find-pkg-share romea_gps_meta_bringup)/profile/romea_gps_serial_driver.launch.py"
              arg:
                - name: device
                  value: /dev/ttyUSB0
                - name: baudrate
                  value: "115200"
          - include:
              file: $(find-pkg-share romea_gps_meta_bringup)/profile/ntrip_client.launch.py
              arg:
                - name: mountpoint
                  value: MTLDR
      if: $(eval "'$(var mode)' == 'live'")
  - include:
      file: $(find-pkg-share romea_gps_meta_bringup)/profile/gz_bridge.launch.py
      arg:
        - name: container
          value: "/gz_container"
      if: $(eval "'$(var mode)' == 'simulation_gazebo'")

configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
records:
  nmea_sentence: true
  gps_fix: false
  vel: false
