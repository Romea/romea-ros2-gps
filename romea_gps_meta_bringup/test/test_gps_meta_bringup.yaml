name: gps
namespace: ns
launch:
  - node:
      pkg: romea_gps_meta_bringup
      profile: config/romea_gps_serial_driver.profile.yaml
      param:
        - name: device
          value: /dev/ttyACM0
        - name: baudrate
          value: 115200
  - node:
      pkg: romea_gps_meta_bringup
      profile: config/ntrip_client.profile.yaml
      param:
        - name: mountpoint
          value: MTLDR
configuration:
  manufacturer: septentrio
  model: asterx
  rate: 10
  dual_antenna: true
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
records:
  nmea_sentence: true
  gps_fix: false
  vel: false
