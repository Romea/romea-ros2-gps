nmea_driver:
  package: nmea_navsat_driver
  executable: nmea_topic_serial_reader
  parameters:
    frame_id: gps_link
    port: /dev/ttyACM0
    baud: 115200
  remappings:
    nmea_sentence: nmea
topic_driver:
  package: nmea_navsat_driver
  executable: nmea_topic_driver
  remappings:
    nmea_sentence: nmea
ntrip:
  package: ntrip_client
  executable: ntrip_ros.py
  parameters:
    host: caster.centipede.fr
    port: 2101
    username: centipede
    password: centipede
    mountpoint: MTLDR
    authenticate: true
  remappings:
    nmea: ntrip/nmea
    rtcm: ntrip/rtcm
